<header class="navbar">
  <div class="navbar-container">

    <!-- Left: Logo + Name + Availability Dot -->
    <a routerLink="/home" class="brand">
      <div class="brand-avatar">
        @if (profileData?.profileImage?.url) {
          <img [src]="serverUrl + profileData!.profileImage!.url" [alt]="profileData!.name" />
        }
      </div>
      <span class="brand-name">
        {{ profileData?.name || 'Loading...' }}
      </span>
      @if (profileData?.isAvailable) {
        <span class="status-dot" title="Available for work"></span>
      }
    </a>

    <!-- Center: Navigation Pill -->
    <nav class="nav-pill">
      <a routerLink="/home" routerLinkActive="active" class="nav-link">
        Home
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-link">
        Projects
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link">
        Contact
      </a>
    </nav>

    <!-- Right: Download CV Button -->
    <div class="navbar-actions">
      @if (profileData?.cvFile?.url) {
        <a [href]="serverUrl + profileData!.cvFile!.url" target="_blank" download class="cv-btn">
          <span>Download CV</span>
        </a>
      }
    </div>

  </div>

  <!-- Mobile Nav -->
  <nav class="mobile-nav">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"
      class="mobile-nav-link">Home</a>
    <a routerLink="/projects" routerLinkActive="active" class="mobile-nav-link">Projects</a>
    <a routerLink="/contact" routerLinkActive="active" class="mobile-nav-link">Contact</a>
  </nav>
</header>
